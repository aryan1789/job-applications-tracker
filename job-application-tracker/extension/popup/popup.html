<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jobs Dashboard</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>

    <!-- Login view -->
    <div class="container" id="login-view">
      <div class="header">
        <h1>Jobs Dashboard</h1>
      </div>
      <button class="btn btn-google" id="google-btn">
        <svg width="16" height="16" viewBox="0 0 48 48" style="flex-shrink:0"><path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.86l6.1-6.1C34.36 3.09 29.45 1 24 1 14.82 1 7.01 6.48 3.53 14.22l7.1 5.52C12.32 13.73 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.64-.15-3.22-.42-4.75H24v9h12.7c-.55 2.97-2.22 5.49-4.73 7.18l7.28 5.65C43.55 37.58 46.5 31.5 46.5 24.5z"/><path fill="#FBBC05" d="M10.63 28.26A14.63 14.63 0 0 1 9.5 24c0-1.48.25-2.9.63-4.26l-7.1-5.52A23.94 23.94 0 0 0 0 24c0 3.87.93 7.52 2.57 10.74l8.06-6.48z"/><path fill="#34A853" d="M24 47c5.45 0 10.02-1.8 13.35-4.88l-7.28-5.65c-1.8 1.21-4.1 1.93-6.07 1.93-6.3 0-11.68-4.23-13.37-9.74l-8.06 6.48C7.01 41.52 14.82 47 24 47z"/></svg>
        Continue with Google
      </button>
      <div class="divider-row"><span>or</span></div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary" id="login-btn">Sign in</button>
      <div id="login-msg" class="message" style="display:none;"></div>
    </div>

    <!-- Job view -->
    <div class="container" id="job-view" style="display:none;">
      <div class="header">
        <h1>Jobs Dashboard</h1>
        <button class="signout-btn" id="signout-btn">Sign out</button>
      </div>
      <span class="site-badge" id="site-badge"></span>
      <div class="field">
        <label for="company">Company</label>
        <input type="text" id="company" placeholder="e.g. Atlassian" />
      </div>
      <div class="field">
        <label for="role">Role</label>
        <input type="text" id="role" placeholder="e.g. Software Engineer" />
      </div>
      <div class="field">
        <label for="notes">Notes <span style="color:#94a3b8;font-weight:400;">(optional)</span></label>
        <textarea id="notes" rows="2" placeholder="Any notes..."></textarea>
      </div>
      <button class="btn btn-primary" id="add-btn">Add Application</button>
      <div id="job-msg" class="message" style="display:none;"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
